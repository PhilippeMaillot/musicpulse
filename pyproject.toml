[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musicpulse"
version = "0.1.0"
description = "Analyse des tendances d'ecoute et recommandations musicales avec Firestore et Redis"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.38,<2",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "redis>=5.0,<7",
  "firebase-admin>=6.5,<8",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

